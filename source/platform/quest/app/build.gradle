// Doom VR, standalone Android build (Quest 3, Steam Frame through Lepton).
// The native libraries come from the engine's own CMake build (arm64, and
// x86_64 for the desk emulator) and are copied into libs/ by
// tools/build-quest.ps1, which also puts the engine's own files into assets/engine.
apply plugin: 'com.android.application'

android {
    namespace "net.gameordie.doomvr"
    androidResources {
        // The engine's archives and soundfont are read straight out of the APK.
        noCompress "pk3", "ipk3", "wad", "sf2", "zip"
    }
    compileSdkVersion 34
    defaultConfig {
        applicationId "net.gameordie.doomvr"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 17
        versionName "1.2.3"
    }
    // The release key stays off the repository: GOD_KEYSTORE names a
    // properties file (storeFile, storePassword, keyAlias, keyPassword).
    // Every release must carry the same key, or it will not install over
    // the last one.
    def ksFile = System.getenv('GOD_KEYSTORE') ? file(System.getenv('GOD_KEYSTORE')) : null
    signingConfigs {
        if (ksFile != null && ksFile.exists()) {
            release {
                def ks = new Properties()
                ksFile.withInputStream { ks.load(it) }
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            ndk { abiFilters 'arm64-v8a', 'x86_64' }	// x86_64: the desk emulator only
        }
        release {
            minifyEnabled false
            ndk { abiFilters 'arm64-v8a' }	// the headsets
            if (ksFile != null && ksFile.exists())
                signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    lint {
        abortOnError false
    }
}
